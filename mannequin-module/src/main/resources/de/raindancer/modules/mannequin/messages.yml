# Rain's Mannequins — every line this module says.
#
# Offered as a *floor*: anything an owner has already written in their own messages.yml wins. See
# Messages.defineFrom. Every placeholder a line asks for is supplied where it is sent, and nothing
# here is YAML's idea of a truth value — see rtp-module's messages.yml for why both of those matter.
mannequin:

  usage: "<gray>Usage: <white>/mannequin</white> [create [kind] | list | loadout <id> | skin <id> | stats <id> | remove <id> | statue <player>]"
  only-a-player: "<red>Only a player standing in the world can do that."
  missing-id: "<red>Which one? Usage: <white><usage></white> — <white>/mannequin list</white> shows your ids."
  unknown-id: "<red>There is no mannequin called <white><id></white>. <white>/mannequin list</white> shows the ids you can use."
  busy: "<red>You are already being asked something else. Answer that one first."
  no-permission: "<red>You are neither its owner nor trusted with it. Ask its owner to trust you."

  redstone:
    barrel-at: "<yellow>The barrel is at <white><x> <y> <z></white>. Build a comparator beside it, at that exact height."

  skin:
    ask-name: "<gray>Type a Minecraft username, or 'cancel'."
    left-as-it-is: "<gray>Left as it was. No changes."
    looking-up: "<gray>Looking up <white><name></white>…"
    found: "<green>Found <white><name></white>. Applying their skin."
    not-found: "<red>Nobody called <white><name></white> could be found. Check the spelling."

  rename:
    ask-name: "<gray>Type a new name for this mannequin, or 'cancel'."
    left-as-it-is: "<gray>Left as it was. Same name."
    done: "<green>Renamed to <white><name></white>."

  create:
    no-permission: "<red>You may not create a mannequin here."
    done: "<green>Created mannequin <white><id></white>. It stands very still. <gray>/mannequin opens it to dress it, skin it or share it."
    unknown-kind: "<red>There is no mannequin kind called <white><kind></white>. Try player, zombie, skeleton, wither or iron_golem."

  statue:
    no-permission: "<red>You may not place statues."
    looking-up: "<gray>Looking up <white><name></white>…"
    not-found: "<red>Nobody called <white><name></white> could be found. Check the spelling."
    done: "<green>A statue of <white><name></white> stands here now (<white><id></white>). Nothing can hurt it."
    not-for-statues: "<red>A statue wears its player's own skin and keeps no training stats."
    usage: "<red>Whose statue? /mannequin statue <player>, or top <board> <place>; pose, hold and remove work on one standing here."
    none-here: "<red>No statue in sight. Look at one, stand next to it, or add its id."
    not-a-statue: "<red><white><id></white> is a training dummy, not a statue."
    removed: "<green>The statue of <white><name></white> (<white><id></white>) is gone."
    top:
      usage: "<red>Which place? Usage: <white>/mannequin statue top <board> <place 1-10></white>. Boards: <white><boards></white>."
      unknown-board: "<red>There is no leaderboard called <white><board></white>. Boards: <white><boards></white>."
      no-boards: "<red>No plugin has registered a leaderboard on this server."
      bad-place: "<red>The place has to be a number from <white>1</white> to <white><most></white>."
      done: "<green>A statue of place <white>#<place></white> on <white><board></white> stands here now (<white><id></white>). It shows whoever holds the place."
    hold:
      done: "<green><white><name></white> now holds what you hold. An empty hand empties its hand."
    pose:
      usage: "<red>Which pose? Usage: <white>/mannequin statue pose <pose> [id]</white>, poses: <white><poses></white>."
      done: "<green><white><name></white> is <white><pose></white> now."

  price:
    paid: "<gray>That cost <white><price></white>."
    not-enough: "<red>A mannequin costs <white><price></white>, and you cannot afford it."
    refused: "<red>The price of <white><price></white> could not be taken, so no mannequin was made."
    placement-failed: "<red>The mannequin could not be placed, so you were not charged."

  remove:
    no-permission: "<red>That is not your mannequin to remove. Ask its owner."
    are-you-sure: "<yellow>This removes <white><id></white> for good. Type /mannequin remove <id> confirm to do it."
    done: "<green>Removed mannequin <white><id></white>."

  list:
    header: "<gray>Your mannequins (<white><count></white>) — <white>/mannequin</white> opens them as a menu:"
    empty: "<gray>You have no mannequins. Quite lonely in here. <white>/mannequin create</white> makes one where you stand."
    entry: "<white><id></white> <gray>— <white><name></white> <gray>in <white><world></white>"

  share:
    trusted: "<green>Trusted <white><player></white> with <white><name></white>."
    untrusted: "<yellow>No longer trusted: <white><player></white> on <white><name></white>."
    notify-trusted: "<green><player></green> trusted you with their mannequin <white><name></white>."

  claim:
    linked: "<green><name></green> now belongs to <white><claim></white>. Settled in."
    unlinked: "<yellow><name></yellow> no longer belongs to a claim."
    not-standing-in-one: "<red>Stand inside the claim you want to link it to first."
    not-your-claim: "<red>You do not own the claim you are standing in."
